  <text class="m" x="46" y="340" font-size="12" fill="#6e7681">2</text>
  <text class="m" x="46" y="372" font-size="12" fill="#6e7681">3</text>
  <text id="hooks-l1" class="m anim" x="66" y="308" font-size="12" fill="#e6edf3" opacity="0">{<tspan fill="#8b949e">"hook"</tspan>:"escopo-da-task",<tspan fill="#8b949e">"modo"</tspan>:<tspan fill="#d29922">"aviso"</tspan>,<tspan fill="#8b949e">"regra_violada"</tspan>:"escopo"}</text>
  <text id="hooks-l2" class="m anim" x="66" y="340" font-size="12" fill="#e6edf3" opacity="0">{<tspan fill="#8b949e">"hook"</tspan>:"segredo",<tspan fill="#8b949e">"modo"</tspan>:<tspan fill="#f85149">"bloqueio"</tspan>}</text>
