  </rect>
  <rect x="732" y="122" width="6" height="0" rx="3" fill="#f85149">
    <animate attributeName="height" values="0;0;56;56;0;0" keyTimes="0;0.8357;0.8607;0.9357;0.9607;1" calcMode="spline" keySplines="0 0 1 1;.3 0 .2 1;0 0 1 1;.4 0 .6 1;0 0 1 1" dur="14s" repeatCount="indefinite"/>
  </rect>

