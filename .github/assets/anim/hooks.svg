  <!-- cartão -->
  <rect x="0.5" y="0.5" width="999" height="429" rx="16" fill="#0d1117" stroke="#30363d"/>

  <!-- título -->
  <text class="t" x="28" y="48" font-size="20" font-weight="600" fill="#e6edf3">Hooks — quem executa é o harness, não o modelo</text>
  <text class="t" x="28" y="72" font-size="13" fill="#8b949e">não criam regra nova; garantem regras que já existem</text>
  <text class="m" x="972" y="48" font-size="13" fill="#8b949e" text-anchor="end">modo em .expx/hooks.json</text>

  <!-- esteira (estática: só pacotes e portões carregam o movimento) -->
  <rect x="28" y="145" width="944" height="10" rx="5" fill="#161b22" stroke="#30363d"/>
  <line x1="40" y1="150" x2="960" y2="150" stroke="#6e7681" stroke-width="2" stroke-dasharray="6 14" stroke-linecap="round" opacity=".8"/>
  <!-- vagas de entrada e saída: placas opacas, únicos lugares onde um pacote aparece ou some (o trilho nunca atravessa o texto) -->
  <rect x="28" y="136" width="200" height="28" rx="7" fill="#161b22" stroke="#30363d" stroke-dasharray="4 4"/>
  <rect x="772" y="136" width="200" height="28" rx="7" fill="#161b22" stroke="#30363d" stroke-dasharray="4 4"/>

  <!-- portões -->

  <!-- portão escopo-da-task -->
