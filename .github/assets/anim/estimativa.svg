    <circle cx="185" cy="124" r="4" fill="#3fb950"/>
    <circle cx="235" cy="124" r="3.5" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  </g>
  <!-- T-01.02 (99 px) -->
  <text x="48" y="158" fill="#e6edf3">T-01.02</text>
  <line x1="150" y1="154" x2="280" y2="154" stroke="#30363d" stroke-width="2"/>
  <g class="seg seg2">
    <text class="k" x="150" y="147" text-anchor="middle">o</text>
    <text class="k" x="185" y="147" text-anchor="middle">m</text>
    <text class="k" x="249" y="147" text-anchor="middle">p</text>
    <line x1="150" y1="154" x2="249" y2="154" stroke="#3fb950" stroke-width="2" stroke-opacity="0.7"/>
    <circle cx="150" cy="154" r="3.5" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <circle cx="185" cy="154" r="4" fill="#3fb950"/>
    <circle cx="249" cy="154" r="3.5" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
