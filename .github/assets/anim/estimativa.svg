</g>
<text class="m ap apC" x="688" y="199" font-size="15" font-weight="700" fill="#58a6ff">35–42 h</text>
<!-- via lateral: as peças ∥ estacionam aqui, fora da barra, ao lado da explicação -->
<g class="ap apA"><use href="#est-par" x="597" y="224"/><text class="m k" x="611" y="224" font-size="13">paralelas não alongam a cadeia</text></g>

