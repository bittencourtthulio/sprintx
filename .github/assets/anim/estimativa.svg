<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="F3.5: faixa de esforço, nunca número único; esforço, nunca prazo. Esforço total versus caminho crítico.">
<title>F3.5 Estimativa da sprintx: três pontos por task, PERT e quadratura, faixa de esforço total e de caminho crítico, confiança limitada sem histórico, e número único e prazo riscados</title>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.k{fill:#8b949e}.v{fill:#e6edf3}.d{fill:#6e7681}

/* ciclo mestre: 12 s. percentuais = t/12. tudo esmaece em 95% e volta ao estado inicial em 99.167% */
.seg{opacity:0;animation:est-seg 12s ease-out infinite}
.seg1{animation-name:est-seg1}.seg2{animation-name:est-seg2}.seg3{animation-name:est-seg3}.seg4{animation-name:est-seg4}
@keyframes est-seg1{0%,4.167%{opacity:0;transform:translateX(-10px)}7.5%{opacity:1;transform:translateX(0)}95%{opacity:1;transform:translateX(0)}99.167%,100%{opacity:0;transform:translateX(0)}}
@keyframes est-seg2{0%,10%{opacity:0;transform:translateX(-10px)}13.333%{opacity:1;transform:translateX(0)}95%{opacity:1;transform:translateX(0)}99.167%,100%{opacity:0;transform:translateX(0)}}
@keyframes est-seg3{0%,15.833%{opacity:0;transform:translateX(-10px)}19.167%{opacity:1;transform:translateX(0)}95%{opacity:1;transform:translateX(0)}99.167%,100%{opacity:0;transform:translateX(0)}}
@keyframes est-seg4{0%,21.667%{opacity:0;transform:translateX(-10px)}25%{opacity:1;transform:translateX(0)}95%{opacity:1;transform:translateX(0)}99.167%,100%{opacity:0;transform:translateX(0)}}

/* peças que voam, uma task por vez: T-01.01 3.2–3.9 s · T-01.02 4.2–4.9 s · T-01.03 5.5–6.2 s · T-01.04 6.5–7.2 s
   as verdes somem no instante do pouso (o preenchimento cresce a partir daí); as azuis das tasks ∥ ficam estacionadas ao lado do rótulo */
.pc{opacity:0;animation:est-pc 12s linear infinite}
.f1{animation-name:est-f1}.f2{animation-name:est-f2}.f3{animation-name:est-f3}.f4{animation-name:est-f4}
.c3{animation-name:est-c3}.c4{animation-name:est-c4}
@keyframes est-f1{0%,26.2%{opacity:0}26.667%{opacity:1}32.5%{opacity:1}33.333%,100%{opacity:0}}
@keyframes est-f2{0%,34.5%{opacity:0}35%{opacity:1}40.833%{opacity:1}41.667%,100%{opacity:0}}
@keyframes est-f3{0%,45.4%{opacity:0}45.833%{opacity:1}51.667%{opacity:1}52.5%,100%{opacity:0}}
@keyframes est-f4{0%,53.7%{opacity:0}54.167%{opacity:1}60%{opacity:1}60.833%,100%{opacity:0}}
@keyframes est-c3{0%,45.4%{opacity:0}45.833%{opacity:1}95%{opacity:1}99.167%,100%{opacity:0}}
@keyframes est-c4{0%,53.7%{opacity:0}54.167%{opacity:1}95%{opacity:1}99.167%,100%{opacity:0}}

/* aparições simples (rótulos, números, nota) */
.ap{opacity:0;animation:est-ap 12s ease-out infinite}
.apA{animation-name:est-apA}.apB{animation-name:est-apB}.apC{animation-name:est-apC}.apD{animation-name:est-apD}.apE{animation-name:est-apE}
@keyframes est-apA{0%,51.667%{opacity:0}54.167%{opacity:1}95%{opacity:1}99.167%,100%{opacity:0}}
@keyframes est-apB{0%,62.5%{opacity:0}65%{opacity:1}95%{opacity:1}99.167%,100%{opacity:0}}
@keyframes est-apC{0%,45.833%{opacity:0;transform:translateX(-6px)}48.333%{opacity:1;transform:translateX(0)}95%{opacity:1;transform:translateX(0)}99.167%,100%{opacity:0;transform:translateX(0)}}
@keyframes est-apD{0%,65%{opacity:0;transform:translateX(-6px)}67.5%{opacity:1;transform:translateX(0)}95%{opacity:1;transform:translateX(0)}99.167%,100%{opacity:0;transform:translateX(0)}}
@keyframes est-apE{0%,74.167%{opacity:0}76.667%{opacity:1}95%{opacity:1}99.167%,100%{opacity:0}}

/* preenchimentos das barras esmaecem no fim do ciclo (largura volta a zero enquanto invisível) */
.fl{animation:est-fl 12s linear infinite}
@keyframes est-fl{0%,95%{opacity:1}99.167%,99.9%{opacity:0}100%{opacity:1}}

/* ponteiro de confiança: baixa → média em 8.3–8.9 s; o destaque comuta só quando o ponteiro assenta */
.ptr{animation:est-ptr 12s cubic-bezier(.4,0,.2,1) infinite}
@keyframes est-ptr{0%,69.167%{transform:translateX(0);opacity:1}74.167%{transform:translateX(172px);opacity:1}95%{transform:translateX(172px);opacity:1}97%{transform:translateX(172px);opacity:0}97.5%{transform:translateX(0);opacity:0}99.5%,100%{transform:translateX(0);opacity:1}}
.hiB{animation:est-hiB 12s linear infinite}
.hiM{opacity:0;animation:est-hiM 12s linear infinite}
@keyframes est-hiB{0%,74.167%{opacity:1}75.833%{opacity:0}97%{opacity:0}99.5%,100%{opacity:1}}
@keyframes est-hiM{0%,74.167%{opacity:0}75.833%{opacity:1}97%{opacity:1}99.5%,100%{opacity:0}}

/* carimbos riscados: 9.4 s e 9.8 s */
.st{opacity:0;animation:est-st 12s cubic-bezier(.2,.9,.3,1.2) infinite}
.st1{animation-name:est-st1}.st2{animation-name:est-st2}
@keyframes est-st1{0%,78.333%{opacity:0;transform:scale(1.5)}80.833%{opacity:1;transform:scale(1)}95%{opacity:1;transform:scale(1)}99.167%,100%{opacity:0;transform:scale(1)}}
@keyframes est-st2{0%,81.667%{opacity:0;transform:scale(1.5)}84.167%{opacity:1;transform:scale(1)}95%{opacity:1;transform:scale(1)}99.167%,100%{opacity:0;transform:scale(1)}}
</style>

<defs>
  <!-- marcador ∥ = paralelizável, desenhado (o glifo U+2225 varia entre fontes) -->
  <g id="est-par" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round"><line x1="0" y1="-9" x2="0" y2="0"/><line x1="4" y1="-9" x2="4" y2="0"/></g>
</defs>

<!-- cartão -->
<rect x="0.5" y="0.5" width="999" height="339" rx="16" fill="#0d1117" stroke="#30363d"/>

<!-- título -->
<text class="s" x="30" y="44" font-size="20" font-weight="600" fill="#e6edf3"><tspan fill="#3fb950">F3.5</tspan> · orçar sem chutar</text>
<text class="s k" x="30" y="66" font-size="13">faixa, nunca número único · esforço, nunca prazo</text>

<!-- ===== ESQUERDA: tasks com três pontos ===== -->
