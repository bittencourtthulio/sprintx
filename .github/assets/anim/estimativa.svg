<text class="s k" x="970" y="104" font-size="13" text-anchor="end">todo o trabalho a fazer — é o que se cobra</text>
<rect x="460" y="110" width="510" height="20" rx="5" fill="#21262d"/>
<g class="fl">
  <rect x="751" y="110" width="0" height="20" rx="5" fill="#3fb950" fill-opacity="0.45">
    <animate attributeName="width" dur="12s" repeatCount="indefinite" calcMode="spline"
