  <line x1="150" y1="184" x2="280" y2="184" stroke="#30363d" stroke-width="2"/>
  <g class="seg seg3">
    <text class="k" x="150" y="177" text-anchor="middle">o</text>
    <text class="k" x="168" y="177" text-anchor="middle">m</text>
    <text class="k" x="200" y="177" text-anchor="middle">p</text>
    <line x1="150" y1="184" x2="200" y2="184" stroke="#3fb950" stroke-width="2" stroke-opacity="0.7"/>
    <circle cx="150" cy="184" r="3.5" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <circle cx="168" cy="184" r="4" fill="#3fb950"/>
    <circle cx="200" cy="184" r="3.5" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  </g>
  <!-- T-01.04 ∥ (67 px) -->
  <text x="48" y="218" fill="#e6edf3">T-01.04</text>
  <use href="#est-par" x="114" y="218"/>
  <line x1="150" y1="214" x2="280" y2="214" stroke="#30363d" stroke-width="2"/>
  <g class="seg seg4">
    <text class="k" x="175" y="207" text-anchor="middle">o</text>
    <text class="k" x="200" y="207" text-anchor="middle">m</text>
    <text class="k" x="242" y="207" text-anchor="middle">p</text>
    <line x1="175" y1="214" x2="242" y2="214" stroke="#3fb950" stroke-width="2" stroke-opacity="0.7"/>
    <circle cx="175" cy="214" r="3.5" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <circle cx="200" cy="214" r="4" fill="#3fb950"/>
    <circle cx="242" cy="214" r="3.5" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  </g>
</g>

<line x1="48" y1="236" x2="402" y2="236" stroke="#30363d"/>
<g class="m" font-size="13">
  <text x="48" y="258"><tspan class="k">média = </tspan><tspan class="v">(o + 4m + p) / 6</tspan></text>
  <text x="48" y="280"><tspan class="k">σ = </tspan><tspan class="v">√(Σ σ²)</tspan><tspan class="d">  (quadratura, não soma)</tspan></text>
</g>

<!-- ===== DIREITA: esforço total × caminho crítico (escala ≈ 5,1 px por hora) ===== -->
