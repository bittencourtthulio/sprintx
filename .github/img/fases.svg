<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Maquina de estados do sprintx: F1 ingestao, F2 descoberta, F3 plano, F4 orquestrador e F5 auditoria formam o planejamento; com veredito SIM a F5 libera a F6 execucao, e um achado de severidade alta devolve o fluxo da F5 para a F3">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2da44e"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e5534b"/>
    </marker>
  </defs>

  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <text x="330" y="28" text-anchor="middle" font-size="12.5" font-weight="600" fill="#8b949e">planejamento — 5 das 6 fases</text>
    <text x="806" y="28" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2da44e">execução</text>

    <rect x="16" y="42" width="628" height="84" rx="10" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 4" opacity=".55"/>

    <g>
      <rect x="30" y="59" width="112" height="50" rx="8" fill="none" stroke="#8b949e" stroke-width="1.6"/>
      <text x="86" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#8b949e">F1</text>
      <text x="86" y="96" text-anchor="middle" font-size="11.5" fill="#8b949e">Ingestão</text>
    </g>
    <g>
      <rect x="154" y="59" width="112" height="50" rx="8" fill="none" stroke="#8b949e" stroke-width="1.6"/>
      <text x="210" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#8b949e">F2</text>
      <text x="210" y="96" text-anchor="middle" font-size="11.5" fill="#8b949e">Descoberta</text>
    </g>
    <g>
      <rect x="278" y="59" width="112" height="50" rx="8" fill="none" stroke="#8b949e" stroke-width="1.6"/>
      <text x="334" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#8b949e">F3</text>
      <text x="334" y="96" text-anchor="middle" font-size="11.5" fill="#8b949e">Plano</text>
    </g>
    <g>
      <rect x="402" y="59" width="112" height="50" rx="8" fill="none" stroke="#8b949e" stroke-width="1.6"/>
      <text x="458" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#8b949e">F4</text>
      <text x="458" y="96" text-anchor="middle" font-size="11.5" fill="#8b949e">Orquestrador</text>
    </g>
    <g>
      <rect x="526" y="59" width="112" height="50" rx="8" fill="none" stroke="#8b949e" stroke-width="1.6"/>
      <text x="582" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#8b949e">F5</text>
      <text x="582" y="96" text-anchor="middle" font-size="11.5" fill="#8b949e">Auditoria</text>
    </g>
    <g>
      <rect x="750" y="59" width="112" height="50" rx="8" fill="none" stroke="#2da44e" stroke-width="2"/>
      <text x="806" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#2da44e">F6</text>
      <text x="806" y="96" text-anchor="middle" font-size="11.5" fill="#2da44e">Execução</text>
    </g>

    <g stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)">
      <line x1="142" y1="84" x2="150" y2="84"/>
      <line x1="266" y1="84" x2="274" y2="84"/>
      <line x1="390" y1="84" x2="398" y2="84"/>
      <line x1="514" y1="84" x2="522" y2="84"/>
    </g>

    <line x1="644" y1="84" x2="744" y2="84" stroke="#2da44e" stroke-width="2" marker-end="url(#ag)"/>
    <text x="694" y="74" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2da44e">VEREDITO: SIM</text>
    <text x="694" y="101" text-anchor="middle" font-size="10" fill="#2da44e">portão binário</text>

    <path d="M582 113 L582 158 L334 158 L334 115" fill="none" stroke="#e5534b" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ar)"/>
    <text x="458" y="175" text-anchor="middle" font-size="11" font-weight="600" fill="#e5534b">achado ALTA → regera o plano</text>

    <text x="806" y="132" text-anchor="middle" font-size="10.5" fill="#2da44e">sem perguntas</text>

    <line x1="16" y1="200" x2="884" y2="200" stroke="#8b949e" stroke-width="1" opacity=".3"/>
    <text x="16" y="224" font-size="11.5" fill="#8b949e">A fase atual é detectada pelo que existe em <tspan font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">docs/&lt;slug&gt;/</tspan> — você nunca precisa dizer em que fase está.</text>
  </g>
</svg>
